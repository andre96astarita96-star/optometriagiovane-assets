<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<style>
:root{--sky:#1FA2E0;--skyd:#0C7FB8;--skyl:#E3F4FC;--sky2:#7FD0F5;--blk:#0B0D12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--blk);font-family:Inter,sans-serif}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden}
#bar{position:absolute;top:250px;left:90px;right:90px;height:8px;border-radius:8px;z-index:10;display:flex;gap:10px}
#bar i{flex:1;height:8px;border-radius:8px;background:rgba(127,208,245,.25);overflow:hidden;position:relative}
#bar i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:8px}
/* COPERTINA con foto */
#cover{background:var(--sky)}
#cover .rings{position:absolute;width:1300px;height:1300px;border-radius:50%;left:120px;top:900px;border:3px solid rgba(255,255,255,.25);box-shadow:0 0 0 110px rgba(255,255,255,.07),0 0 0 220px rgba(255,255,255,.05)}
#cover .ph{position:absolute;right:30px;bottom:0;width:760px;height:930px;object-fit:contain;object-position:right bottom}
#cover .logo{position:absolute;top:300px;left:90px;height:92px}
#cover .k{position:absolute;top:470px;left:90px;font-weight:700;font-size:32px;letter-spacing:.16em;color:#fff;border:3px solid rgba(255,255,255,.7);border-radius:999px;padding:14px 28px}
#cover h1{position:absolute;top:580px;left:90px;width:640px;font-family:Poppins;font-weight:800;font-size:96px;line-height:1.04;color:#fff;z-index:2}
#cover h1 span{color:var(--blk)}
#cover .m{position:absolute;top:1010px;left:90px;width:330px;font-size:32px;line-height:1.3;font-weight:600;color:#fff;z-index:2}
#cover .m b{display:block;font-family:Poppins;font-size:44px;color:var(--blk)}
#cover .num{position:absolute;right:90px;top:300px;text-align:right;font-family:Poppins;color:#fff}
#cover .num small{display:block;font-family:Inter;font-weight:700;font-size:24px;letter-spacing:.18em;color:var(--skyl)}
#cover .num b{font-size:110px;line-height:1;font-weight:800}
/* NOTIZIE */
.nw{background:var(--blk)}
.nw .glow{position:absolute;width:1300px;height:1300px;border-radius:50%;right:-500px;top:-200px;background:radial-gradient(circle,rgba(31,162,224,.45),rgba(31,162,224,0) 65%)}
.nw .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:90px 90px}
.nw .who{position:absolute;top:300px;left:90px;display:flex;align-items:center;gap:22px}
.nw .who img{width:96px;height:96px;border-radius:50%;border:4px solid var(--sky)}
.nw .who div{color:#fff;font-weight:800;font-size:32px;line-height:1.15}
.nw .who small{display:block;font-weight:600;font-size:24px;color:var(--sky2)}
.nw .tag{position:absolute;top:322px;right:90px;font-weight:800;font-size:30px;letter-spacing:.16em;padding:14px 28px;border-radius:999px}
.tag.it{background:var(--skyl);color:var(--skyd)} .tag.wd{background:#fff;color:var(--blk)}
.nw .body{position:absolute;top:470px;left:90px;right:90px;display:flex;flex-direction:column;gap:34px}
.nw .idx{font-family:Poppins;font-weight:800;font-size:130px;line-height:.9;color:transparent;-webkit-text-stroke:3px rgba(127,208,245,.6)}
.nw h2{font-family:Poppins;font-weight:800;font-size:70px;line-height:1.1;color:#fff}
.nw .sum{font-size:40px;line-height:1.4;color:#C9D3DD}
.nw .why{background:rgba(31,162,224,.14);border-left:10px solid var(--sky);border-radius:20px;padding:30px 38px;color:#E7EEF4;font-size:38px;line-height:1.35}
.nw .why b{display:block;font-size:24px;letter-spacing:.16em;color:var(--sky2);margin-bottom:8px}
.nw .src{font-size:28px;color:#8A95A3;font-weight:600}
/* CHIUSURA con foto */
#end{background:var(--skyl)}
#end .circ{position:absolute;width:1100px;height:1100px;border-radius:50%;left:-10px;top:1120px;background:var(--sky)}
#end .ph{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:1000px;height:860px;object-fit:contain;object-position:center bottom}
#end .logo{position:absolute;top:300px;left:50%;transform:translateX(-50%);height:100px}
#end h3{position:absolute;top:470px;left:90px;right:90px;text-align:center;font-family:Poppins;font-weight:800;font-size:86px;line-height:1.08;color:var(--blk)}
#end h3 span{color:var(--sky)}
#end .cta{position:absolute;top:820px;left:0;right:0;margin:0 auto;width:fit-content;background:var(--blk);color:#fff;font-weight:800;font-size:44px;padding:30px 56px;border-radius:24px;white-space:nowrap;z-index:2}
#end .h{position:absolute;top:980px;left:0;right:0;text-align:center;font-size:38px;font-weight:700;color:var(--skyd)}
body.br,html.br{background:transparent}
body.br .nw{background:linear-gradient(180deg,rgba(11,13,18,.80),rgba(11,13,18,.68) 45%,rgba(11,13,18,.82))}
body.br .nw .glow{opacity:.5}
</style></head><body>
<div id="bar"></div>
<div class="sc" id="cover">
  <div class="rings"></div>
  <img class="ph" src="ph-cover.webp">
  <img class="logo" src="logo-white.png">
  <div class="num"><small>NUMERO</small><b id="cnum"></b></div>
  <div class="k">LE NEWS DELLA SETTIMANA</div>
  <h1>Ottica e optometria <span>in Italia e nel mondo</span></h1>
  <div class="m" id="cmeta"></div>
</div>
<div id="news"></div>
<div class="sc" id="end">
  <div class="circ"></div>
  <img class="ph" src="ph-end.webp">
  <img class="logo" src="logo-black.png">
  <h3>Tutti i dettagli <span>nella newsletter</span> di oggi</h3>
  <div class="cta">Iscriviti: link in bio</div>
  <div class="h">@optometria_giovane</div>
</div>
<script>
const D=window.DATA;
const N=D.items.length, T0=D.t0||3.2, TE=D.te||4.2;
const DUR=D.items.map(it=>it.dur||5.6); const ST=[]; let acc=T0; DUR.forEach(d=>{ST.push(acc);acc+=d}); const TEND=acc;
document.getElementById('cnum').textContent=D.numero;
document.getElementById('cmeta').innerHTML='<b>'+N+' notizie in '+Math.round(T0+DUR.reduce((a,b)=>a+b,0)+TE)+' secondi</b>'+D.data+' · con Andrea Astarita';
const bar=document.getElementById('bar'); const news=document.getElementById('news');
D.items.forEach((it,i)=>{
  bar.insertAdjacentHTML('beforeend','<i><b></b></i>');
  news.insertAdjacentHTML('beforeend',`<div class="sc nw"><div class="grid"></div><div class="glow"></div>
  <div class="who"><img src="av.webp"><div>Andrea Astarita<small>Ottico optometrista</small></div></div>
  <div class="tag ${it.tag=='ITALIA'?'it':'wd'}">${it.tag}</div>
  <div class="body"><div class="idx">0${i+1}</div><h2>${it.titolo}</h2><div class="sum">${it.sintesi}</div>
  <div class="why"><b>PERCHÉ TI RIGUARDA</b>${it.perche}</div><div class="src">Fonte: ${it.fonte}</div></div></div>`)});
window.TOTAL=TEND+TE;
window.SCENES=[[0,T0,false],...ST.map((s0,i)=>[s0,DUR[i],true]),[TEND,TE,false]];
if(D.broll&&D.broll.length){document.body.classList.add('br');document.documentElement.classList.add('br')}
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
function set(el,o,dy){el.style.opacity=o;el.style.transform=`translateY(${dy}px)`}
window.render=function(t){
  const cover=document.getElementById('cover'), end=document.getElementById('end');
  const scs=[...news.children];
  cover.style.opacity=t<T0?1:Math.max(0,1-(t-T0)/0.3);
  const cp=ease(t/0.8); const ph=cover.querySelector('.ph'); ph.style.opacity=cp; ph.style.transform=`translateX(${80*(1-cp)}px)`;
  cover.querySelectorAll('.k,h1,.m,.num').forEach((e,j)=>set(e,ease((t-0.15*j)/0.6),40*(1-ease((t-0.15*j)/0.6))));
  bar.style.opacity=(t>T0-0.2&&t<TEND)?1:0;
  scs.forEach((s,i)=>{
    const s0=ST[i], TN=DUR[i], lt=t-s0;
    s.style.opacity=(lt>=0&&lt<TN)?Math.min(1,lt/0.25):0;
    if(lt>=0&&lt<TN){
      const els=[s.querySelector('.who'),s.querySelector('.tag'),...s.querySelector('.body').children];
      els.forEach((e,j)=>{const p=ease((lt-0.1*j)/0.5);set(e,p,50*(1-p))});
    }
    const b=bar.children[i].firstChild; b.style.width=(lt<0?0:lt>TN?100:lt/TN*100)+'%';
  });
  const le=t-TEND;
  end.style.opacity=le>=0?Math.min(1,le/0.3):0;
  const ep=ease(le/0.8); const eph=end.querySelector('.ph'); eph.style.opacity=ep; eph.style.transform=`translateX(-50%) translateY(${120*(1-ep)}px)`;
  end.querySelectorAll('h3,.cta,.h').forEach((e,j)=>{const p=ease((le-0.15*j)/0.6);set(e,p,40*(1-p))});
};
render(0);
</script></body></html>
